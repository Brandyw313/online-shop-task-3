<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop login | Online Shop</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #162d26;
      background: #f4f6f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      display: flex; align-items: center; gap: .65rem;
      padding: 1rem clamp(1rem, 4vw, 3rem);
      background: #193d32; color: white; font-size: 1.05rem; font-weight: 700;
    }
    .back-link { margin-left: auto; color: white; font-size: .95rem; }
    .back-link:focus-visible { outline: 3px solid #e1efb8; outline-offset: 3px; }
    .bag {
      position: relative; width: 18px; height: 16px; margin-top: 3px;
      border: 2px solid #e1efb8; border-radius: 2px;
    }
    .bag::before {
      content: ""; position: absolute; width: 6px; height: 5px;
      left: 2px; top: -7px; border: 2px solid #e1efb8;
      border-bottom: 0; border-radius: 5px 5px 0 0;
    }
    main {
      max-width: 25rem; margin: clamp(1.1rem, 6vh, 3.5rem) auto;
      padding: 0 1rem;
    }
    form {
      padding: clamp(1.1rem, 3vw, 1.8rem);
      background: white; border: 1px solid #d3dcd5; border-radius: 12px;
    }
    h1 { margin: 0 0 1.3rem; font-size: 1.8rem; letter-spacing: -.035em; }
    label { display: block; margin-bottom: .4rem; font-weight: 650; }
    input {
      display: block; width: 100%; padding: .62rem .7rem;
      font: inherit; color: inherit; border: 1px solid #84958c; border-radius: 5px;
    }
    .hint { margin: .35rem 0 1.05rem; color: #485b50; font-size: .875rem; line-height: 1.4; }
    button {
      width: 100%; padding: .72rem; font: inherit; font-weight: 650;
      border: 0; border-radius: 5px; background: #23523f; color: white; cursor: pointer;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid #2867a5; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
    #feedback { margin: 0; font-size: .95rem; line-height: 1.45; }
    #feedback:not(:empty) { padding: .65rem .8rem; margin-top: 1rem; border-left: 3px solid; }
    #feedback[data-state="error"] { color: #872e1a; background: #fff1e9; }
    #feedback[data-state="success"] { color: #20543d; background: #eaf5ea; }
  </style>
</head>
<body>
  <header>
    <span class="bag" aria-hidden="true"></span>Online Shop
    <a class="back-link" href="index.html#shop">Back to shop</a>
  </header>
  <main>
    <form id="login-form" novalidate>
      <h1>Shop login</h1>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" aria-describedby="username-hint" required>
      <p class="hint" id="username-hint">At least 4 characters after removing spaces at either end.</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" aria-describedby="password-hint" required>
      <p class="hint" id="password-hint">At least 8 characters.</p>
      <button id="login-button" type="submit">Sign in</button>
      <p id="feedback" role="status" aria-atomic="true"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const button = document.getElementById("login-button");
    const feedback = document.getElementById("feedback");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      button.disabled = true;

      try {
        // Check the username after removing spaces from both ends.
        if (username.value.trim().length < 4) {
          throw new Error("Your username needs at least 4 characters.");
        }
        if (password.value.length < 8) {
          throw new Error("Your password needs at least 8 characters.");
        }
        feedback.dataset.state = "success";
        feedback.textContent = "Login details passed validation.";
      } catch (error) {
        feedback.dataset.state = "error";
        feedback.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
