<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Online Shop</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body id="home">
  <header><div class="bar"><a class="brand" href="#home">JS Online Shop</a>
    <nav aria-label="Main navigation"><a href="#home">Home</a><a href="#shop">Shop</a><a href="#cart">Cart <span id="cart-count">0</span></a></nav>
  </div></header>
  <main>
    <section id="shop" aria-labelledby="catalog-title">
      <h1 id="catalog-title">Shop the collection</h1>
      <div id="filters" role="group" aria-label="Filter by category"></div>
      <div id="product-grid"></div>
    </section>
    <section id="cart" aria-labelledby="cart-title"><h2 id="cart-title">Your cart</h2>
      <ul id="cart-items"></ul><p id="cart-summary">Your cart is empty.</p>
    </section>
    <p id="status" class="sr-only" role="status"></p>
  </main>
</body>
</html>
